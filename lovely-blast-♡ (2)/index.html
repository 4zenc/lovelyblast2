<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lovely Blast ♡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .font-pacifico {
        font-family: 'Pacifico', cursive;
      }
      /* Custom animations */
      @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        20% { transform: translateY(-20px) scale(1.1); opacity: 1; }
        80% { transform: translateY(-50px) scale(1); opacity: 1; }
        100% { transform: translateY(-70px) scale(0.9); opacity: 0; }
      }
      .animate-float-up {
        animation: floatUp 2s ease-out forwards;
      }
      @keyframes pop {
        0% { transform: scale(0.8); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .animate-pop {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      /* Hide scrollbar */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lovely: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8', // Sky blue
                pink: '#ffe4e6',
                pinkDark: '#fda4af',
              }
            }
          }
        }
      }
    </script>

  }
}
</script>
